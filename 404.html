<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La casa de Nieve</title>
<style>
  body { font-family: system-ui, sans-serif; background: #08111f; color: #eaf3ff;
         display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .caja { text-align: center; padding: 2rem; }
  .copo { font-size: 3rem; }
</style>
</head>
<body>
<div class="caja">
  <div class="copo">❄</div>
  <p id="msg">Buscando la casa de Nieve…</p>
</div>
<script>
  const repo = location.pathname.split('/')[1] || '';
  fetch('/' + repo + '/url.txt?nocache=' + Date.now())
    .then(r => r.text())
    .then(u => {
      u = u.trim();
      if (!u) { document.getElementById('msg').textContent = 'Nieve no está disponible ahora.'; return; }
      const path = location.pathname.replace(new RegExp('^/' + repo), '') || '/';
      location.replace(u.replace(/\/$/, '') + path + location.search + location.hash);
    })
    .catch(() => { document.getElementById('msg').textContent = 'No se pudo conectar con la casa.'; });
</script>
</body>
</html>
