<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>La casa de Nieve</title>
<style>
  body { font-family: system-ui, sans-serif; background: #08111f; color: #eaf3ff;
         display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .caja { text-align: center; padding: 2rem; }
  .copo { font-size: 3rem; }
</style>
</head>
<body>
<div class="caja">
  <div class="copo">❄</div>
  <p id="msg">Buscando la casa de Nieve…</p>
</div>
<script>
  var repo = 'lefudead2022-cloud/nieve-casa';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://raw.githubusercontent.com/' + repo + '/main/url.txt?nocache=' + Date.now(), false);
  xhr.send();
  var u = (xhr.responseText || '').trim();
  if (!u) {
    document.getElementById('msg').textContent = 'Nieve no está disponible ahora.';
  } else {
    var path = location.pathname.replace(/^\/[^/]+/, '') || '/';
    location.replace(u.replace(/\/$/, '') + path + location.search + location.hash);
  }
</script>
</body>
</html>
